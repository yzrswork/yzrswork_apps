name: Verify Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate committed assets
        run: npm run build
      - name: Verify generated files are committed
        run: git diff --exit-code
      - name: Run repository quality checks
        run: npm run check
