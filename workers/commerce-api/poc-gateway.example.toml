# LOCAL ONLY. Copy outside Git; absolute main path to poc-gateway.js.
# Do not deploy this gateway and do not use --remote, Tunnel or --test-scheduled.
name = "yzrs-deals-poc-local-gateway"
main = "poc-gateway.js"
account_id = "6f5ab4de678487058a637479d3e7fb76"
# Wrangler 4.119.0 bundles a workerd supporting dates through 2026-08-08.
compatibility_date = "2026-08-08"
workers_dev = false
preview_urls = false
[triggers]
crons = []
[[services]]
binding = "POC"
service = "yzrs-deals-poc-20261004"
remote = true
# Local .dev.vars: random POC_MANUAL_KEY. Never browser-visible or logged.
